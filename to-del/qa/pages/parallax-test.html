<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parallax Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a2228; }

    .hero {
      position: relative;
      height: 100vh;
      overflow: hidden;
    }

    .hero img {
      position: absolute;
      top: -10%;
      left: -5%;
      width: 110%;
      height: 120%;
      object-fit: cover;
      object-position: center;
      transition: transform 0.15s ease-out;
      will-change: transform;
    }

    .layer-sky       { z-index: 1; }
    .layer-mountains { z-index: 2; }
    .layer-hills     { z-index: 3; }
    .layer-banana    { z-index: 4; }
  </style>
</head>
<body>

<div class="hero" id="hero">
  <img id="sky"       class="layer-sky"       src="/assets/global/backgrounds/éléments-bg/parallax/bg-sky.png" alt="">
  <img id="mountains" class="layer-mountains" src="/assets/global/backgrounds/éléments-bg/parallax/bg-mountains.png" alt="">
  <img id="hills"     class="layer-hills"     src="/assets/global/backgrounds/éléments-bg/parallax/bg-hills.png" alt="">
  <img id="banana"    class="layer-banana"    src="/assets/global/backgrounds/éléments-bg/parallax/bg-banana-tree.png" alt="">
</div>

<script>
  var sky       = document.getElementById('sky');
  var mountains = document.getElementById('mountains');
  var hills     = document.getElementById('hills');
  var banana    = document.getElementById('banana');

  document.addEventListener('mousemove', function(e) {
    var dx = (e.clientX / window.innerWidth  - 0.5);  /* -0.5 à +0.5 */
    var dy = (e.clientY / window.innerHeight - 0.5);  /* -0.5 à +0.5 */

    sky.style.transform       = 'translate(' + (dx * -8)  + 'px,' + (dy * -6)  + 'px)';
    mountains.style.transform = 'translate(' + (dx * -20) + 'px,' + (dy * -16) + 'px)';
    hills.style.transform     = 'translate(' + (dx * -40) + 'px,' + (dy * -30) + 'px)';
    banana.style.transform    = 'translate(' + (dx * -70) + 'px,' + (dy * -55) + 'px)';
  });
</script>
</body>
</html>
