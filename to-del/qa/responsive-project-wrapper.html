<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<title>QA responsive — Latitude Sud</title>
<style>
  html,body{margin:0;min-height:100%;background:#343434}
  body{display:grid;place-items:start center;padding:16px;box-sizing:border-box}
  iframe{display:block;width:390px;height:844px;border:0;background:#fff;box-shadow:0 24px 70px rgba(0,0,0,.45)}
</style>
<iframe id="qa-frame" title="Aperçu responsive"></iframe>
<script>
  const params = new URLSearchParams(location.search);
  const frame = document.getElementById('qa-frame');
  frame.style.width = `${Math.max(320, Math.min(1024, Number(params.get('width')) || 390))}px`;
  frame.style.height = `${Math.max(640, Math.min(1200, Number(params.get('height')) || 844))}px`;
  frame.addEventListener('load', () => {
    const selector = params.get('selector');
    if (!selector) return;
    const trigger = frame.contentDocument.querySelector(selector);
    if (trigger) window.setTimeout(() => {
      trigger.click();
      const scrollSelector = params.get('scroll');
      if (scrollSelector) window.setTimeout(() => {
        frame.contentDocument.querySelector(scrollSelector)?.scrollIntoView({block:'start'});
      }, 700);
    }, 120);
  });
  frame.src = params.get('src') || '/pages/social.html';
</script>
</html>
