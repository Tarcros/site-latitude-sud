<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QA responsive</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #181818; }
    iframe { display: block; border: 0; background: #fff; }
  </style>
</head>
<body>
  <iframe title="Apercu responsive"></iframe>
  <script>
    const params = new URLSearchParams(location.search);
    const frame = document.querySelector('iframe');
    frame.width = params.get('w') || '390';
    frame.height = params.get('h') || '844';
    frame.src = params.get('page') || '/index.html';
  </script>
</body>
</html>
